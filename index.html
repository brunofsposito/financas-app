<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>Finanças</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <h1 id="titulo-mes">Mês</h1>
  </header>

  <main>
    <!-- Resumo do mês -->
    <section class="resumo" aria-label="Resumo do mês">
      <div class="card card-saldo">
        <span class="rotulo">Saldo do mês</span>
        <strong id="saldo">R$ 0,00</strong>
      </div>
      <div class="card card-entrou">
        <span class="rotulo">Entrou</span>
        <strong id="entrou">R$ 0,00</strong>
      </div>
      <div class="card card-saiu">
        <span class="rotulo">Saiu</span>
        <strong id="saiu">R$ 0,00</strong>
      </div>
    </section>

    <!-- Lista de lançamentos do mês -->
    <section aria-label="Lançamentos do mês">
      <h2 class="subtitulo">Lançamentos</h2>
      <ul id="lista" class="lista"></ul>
      <p id="vazio" class="vazio">Nenhum lançamento neste mês.<br>Toque em <strong>+</strong> para começar.</p>
    </section>
  </main>

  <button id="botao-novo" class="botao-novo" aria-label="Novo lançamento">+</button>

  <!-- Formulário de lançamento (abre por cima da tela) -->
  <dialog id="dialogo" class="dialogo">
    <form id="formulario" method="dialog" novalidate>
      <h2 id="titulo-formulario">Novo lançamento</h2>

      <fieldset class="alternador alternador-movimento">
        <legend class="sr-only">Movimento</legend>
        <label><input type="radio" name="movimento" value="saida" checked><span>Saída</span></label>
        <label><input type="radio" name="movimento" value="entrada"><span>Entrada</span></label>
      </fieldset>

      <label class="campo">
        <span>Valor (R$)</span>
        <input name="valor" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off" required>
      </label>

      <label class="campo">
        <span>Descrição</span>
        <input name="descricao" type="text" maxlength="60" placeholder="Ex.: Conta de luz" autocomplete="off" required>
      </label>

      <label class="campo">
        <span>Categoria</span>
        <select name="categoria" required></select>
      </label>

      <label class="campo">
        <span>Data</span>
        <input name="data" type="date" required>
      </label>

      <fieldset class="alternador">
        <legend class="sr-only">Tipo</legend>
        <label><input type="radio" name="tipo" value="pessoal" checked><span>Pessoal</span></label>
        <label><input type="radio" name="tipo" value="profissional"><span>Profissional</span></label>
      </fieldset>

      <p id="erro" class="erro" role="alert"></p>

      <div class="acoes">
        <button type="button" id="botao-cancelar" class="botao botao-secundario">Cancelar</button>
        <button type="submit" class="botao botao-primario">Salvar</button>
      </div>
      <button type="button" id="botao-excluir" class="botao-excluir" hidden>Excluir lançamento</button>
    </form>
  </dialog>

  <!-- A ordem importa: cada arquivo usa o que foi carregado antes dele -->
  <script src="js/categorias.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/lancamentos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
